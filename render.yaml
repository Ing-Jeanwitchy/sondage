services:
  - type: web
    name: sondage-nord-ouest-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_demo_data && gunicorn core.wsgi:application"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_2qWJy0bkjNxV@ep-long-credit-aefr1km3-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nordoeust.web.app,https://nordoeust.firebaseapp.com"

